[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "public-bounty-radar"
version = "0.1.0"
description = "Read-only offline public bounty discovery and risk triage MVP."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Public Bounty Radar"}]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
public-bounty-radar = "public_bounty_radar.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
