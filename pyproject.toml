[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bounty-sieve"
version = "0.1.0"
description = "Read-only offline bounty opportunity triage and safety filtering."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Bounty Sieve Maintainers"}]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
bounty-sieve = "bounty_sieve.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
